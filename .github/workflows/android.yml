name: android

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: build APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Gradle 的 daemon JVM 条件是 25（见 gradle/gradle-daemon-jvm.properties），
      # 本地也是 Zulu 25，两边保持一致。
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # 不用 android-actions/setup-android：它内部跑 `sdkmanager --licenses` 时会被
      # 新版权工具的交互提示卡住（"Review licenses that have not been accepted (y/N)?"），
      # 那一步直接失败。这里改成自己用 `yes |` 非交互接受许可，
      # 然后让 AGP 自己下载它需要的 platform / build-tools（android.builder.sdkDownload 默认开）。
      - name: Accept the Android SDK licenses
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $sdk"
          cm="$sdk/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$cm" ]; then
            cm=$(find "$sdk/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)
          fi
          echo "sdkmanager: ${cm:-not found}"
          if [ -n "$cm" ]; then
            yes | "$cm" --licenses >/dev/null 2>&1 || true
          fi
          echo "accepted licenses:"
          ls "$sdk/licenses" 2>/dev/null || echo "  (licenses 目录不存在)"

      - uses: gradle/actions/setup-gradle@v6

      # debug 签名由 app/build.gradle.kts 里显式指定的 keystore/debug.keystore 提供，
      # 不依赖各机器/各平台上 AGP 默认解析出的那把密钥。
      # release 不带签名：仓库里没有 keystore.properties，hasReleaseSigning 为 false，
      # AGP 就跳过签名，产出 app-release-unsigned.apk，由本地用 keystore/qse-release.jks 签。
      - name: Build debug and release
        run: ./gradlew assembleDebug assembleRelease

      # 诊断：AGP 到底把 debug 签名解析成了哪个密钥
      - name: Signing diagnostics
        if: always()
        run: |
          set -euo pipefail
          echo "HOME=$HOME"
          echo "--- android 相关环境变量 ---"
          env | grep -i android || true
          echo "--- \$HOME/.android ---"
          ls -la "$HOME/.android" || true
          echo "--- gradle signingReport ---"
          ./gradlew :app:signingReport 2>&1 | tail -60 || true

      - name: Report the release APK
        if: always()
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -1) || true
          echo "release APK: ${apk:-<none>}"
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: ${apksigner:-<none>}"
          if [ -n "$apk" ] && [ -n "$apksigner" ] && "$apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "::warning::release APK is signed - a keystore.properties was present on the runner"
          else
            echo "release APK is unsigned, as expected - sign it locally with keystore/qse-release.jks"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: QuarkScanExtractor-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK (unsigned)
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: QuarkScanExtractor-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      # 放在最后：校验不过就是构建失败，但产物已经先上传了，便于排查
      - name: Check the debug APK is signed with the repo debug key
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          [ -n "$apksigner" ] || { echo "::error::apksigner not found"; exit 1; }
          want=1c98acc1d156621f9a87fa1001e75b589cd719f74e276c30256272034f45ebab
          got=$("$apksigner" verify --print-certs "$apk" \
                | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr -d '\r')
          echo "debug APK  SHA-256: $got"
          echo "repo debug key    : $want"
          if [ "$got" != "$want" ]; then
            echo "::error::debug APK is not signed with the repo debug key"
            exit 1
          fi
          echo "签名与本机 Android Studio 构建一致，可直接覆盖安装"
